<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SBI履歴 - 修正版</title>
    <style>
        pre {
            font-family: "MS Gothic", "Osaka-Mono", monospace;
            line-height: 1.5;
            white-space: pre;
            background-color: #f0f4f8;
            padding: 15px;
            border: 1px solid #acc;
            overflow-x: auto;
        }
        #error-message {
            color: red;
            font-weight: bold;
            background: #ffebeb;
            padding: 10px;
            display: none; /* エラー時のみ表示 */
            margin-bottom: 10px;
        }
        #update-time {
            font-size: 0.8em;
            color: #666;
            margin-left: 10px;
        }
    </style>
</head>
<body>

<div id="error-message"></div>

<h2>
    <span id="title"></span>
    <span id="update-time"></span>
</h2>
<pre id="result">読み込み中...</pre>

<script>
const params = new URLSearchParams(location.search);
const code = params.get("code");
const targetCode = code ? code.trim() : "";
document.getElementById("title").textContent = "SBI銘柄コード: " + (targetCode || "未指定");

function showError(msg) {
    const errDiv = document.getElementById("error-message");
    errDiv.textContent = "【エラー】" + msg;
    errDiv.style.display = "block";
    document.getElementById("result").textContent = "停止しました。";
}

// SBI.CSV を読み込む
fetch("SBI.CSV?t=" + new Date().getTime())
    .then(r => {
        if (!r.ok) throw new Error(`"SBI.CSV" が見つかりません。ファイル名が半角大文字であるか確認してください。 (Status: ${r.status})`);
        
        const lastModified = r.headers.get("Last-Modified");
        if (lastModified) {
            const d = new Date(lastModified);
            document.getElementById("update-time").textContent = 
                `(更新: ${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")})`;
        }
        return r.arrayBuffer(); 
    })
    .then(buf => {
        // Shift-JISでデコードを試みる
        const text = new TextDecoder("shift-jis").decode(buf);
        
        // 行分割（空行を除去）
        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l !== "");
        if (lines.length === 0) throw new Error("CSVファイルが空です。");

        // ヘッダー解析
        const header = lines[0].split(",").map(h => h.replace(/"/g, "").trim());
        
        // データ行の抽出
        const dataRows = lines.slice(1).map(l => {
            // カンマ区切り（引用符内を考慮）
            return l.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(item => {
                return item.replace(/"/g, "").trim();
            });
        }).filter(c => {
            // 銘柄コード（3列目 = index 2）を比較
            // c[2]が存在し、かつ指定されたコードと一致するか
            return c[2] && c[2] === targetCode;
        });

        if (dataRows.length === 0) {
            document.getElementById("result").textContent = header.join(" | ") + `\n\n(銘柄コード "${targetCode}" に一致するデータはありませんでした)`;
            return;
        }

        const targetRows = [header, ...dataRows];

        // 文字幅計算用関数
        const getDisplayWidth = (str) => {
            let width = 0;
            for (let i = 0; i < str.length; i++) {
                const c = str.charCodeAt(i);
                if ((c >= 0x0 && c < 0x81) || (c >= 0xff61 && c <= 0xff9f)) {
                    width += 1;
                } else {
                    width += 2;
                }
            }
            return width;
        };

        // 各列の最大幅を計算
        const colWidths = header.map((_, i) => {
            return Math.max(...targetRows.map(row => getDisplayWidth(row[i] || "")));
        });

        // テキスト整形
        const formatted = targetRows.map(row => {
            return row.map((val, i) => {
                const s = val || "";
                const padSize = colWidths[i] - getDisplayWidth(s);
                return s + " ".repeat(padSize);
            }).join(" | ");
        }).join("\n");

        document.getElementById("result").textContent = formatted;
    })
    .catch(e => {
        showError(e.message);
    });
</script>

</body>
</html>
