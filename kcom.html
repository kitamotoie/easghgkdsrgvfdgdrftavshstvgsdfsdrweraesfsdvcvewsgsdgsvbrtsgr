
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>カブコム在庫照会</title>
    <style>
        /* 列を揃えるために等幅フォントを指定 */
        pre {
            font-family: 'Courier New', Consolas, monospace;
            line-height: 1.5;
            white-space: pre;
        }
    </style>
</head>
<body>

<h2 id="title"></h2>
<pre id="result">読み込み中...</pre>

<script>
const params = new URLSearchParams(location.search);
const code = params.get("code");
document.getElementById("title").textContent = "銘柄コード: " + (code ? code : "未指定");

fetch("MarginBrand.csv?t=" + new Date().getTime())
    .then(r => {
        if (!r.ok) throw new Error("CSVが見つかりません");
        return r.arrayBuffer(); 
    })
    .then(buf => {
        const text = new TextDecoder("shift-jis").decode(buf);
        const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
        
        if (lines.length === 0) return;

        // 1. ヘッダーと対象行を抽出
        const header = lines[0].split(",");
        const dataRows = lines.slice(1)
            .map(line => line.split(","))
            .filter(cols => cols[0] === code);

        const targetRows = [header, ...dataRows];

        if (dataRows.length === 0) {
            document.getElementById("result").textContent = lines[0] + "\n(該当データなし)";
            return;
        }

        // 2. 各列の最大幅を計算して揃える
        const colWidths = header.map((_, i) => {
            return Math.max(...targetRows.map(row => {
                const val = row[i] || "";
                // 全角文字を2文字分として計算（簡易版）
                return val.split("").reduce((acc, char) => acc + (char.match(/[^\x01-\x7E]/) ? 2 : 1), 0);
            }));
        });

        // 3. パディング処理して結合
        const formatted = targetRows.map(row => {
            return row.map((val, i) => {
                const s = val || "";
                const currentLen = s.split("").reduce((acc, char) => acc + (char.match(/[^\x01-\x7E]/) ? 2 : 1), 0);
                return s + " ".repeat(Math.max(0, colWidths[i] - currentLen));
            }).join("  |  "); // 列の区切り
        }).join("\n");

        document.getElementById("result").textContent = formatted;
    })
    .catch(e => {
        document.getElementById("result").textContent = "エラー: " + e.message;
    });
</script>

</body>
</html>
