<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>カブコム在庫照会</title>
</head>
<body>

<h2 id="title"></h2>
<pre id="result">読み込み中...</pre>

<script>
const params = new URLSearchParams(location.search);
const code = params.get("code");
document.getElementById("title").textContent = "銘柄コード: " + (code ? code : "未指定");

fetch("MarginBrand.csv?t=" + new Date().getTime())
    .then(r => {
        if (!r.ok) throw new Error("CSVが見つかりません");
        return r.arrayBuffer(); 
    })
    .then(buf => {
        // Shift_JISでデコード（文字化け対策）
        const text = new TextDecoder("shift-jis").decode(buf);
        const lines = text.split(/\r?\n/);
        
        // 1列目が指定コードと完全一致する行だけを抽出
        const filtered = lines.filter(line => {
            const cols = line.split(",");
            return cols[0] === code; 
        });

        if (filtered.length === 0) {
            document.getElementById("result").textContent = "該当データなし";
        } else {
            // フィルタリングされた行を改行でつなげて、加工せずそのまま出す
            document.getElementById("result").textContent = filtered.join("\n");
        }
    })
    .catch(e => {
        document.getElementById("result").textContent = "エラー: " + e.message;
    });
</script>

</body>
</html>
