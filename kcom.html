CSVの1行目（ヘッダー行）と、指定したコードに一致する行をあわせて表示するように修正しました。

これで、どの値が「在庫数」で、どの値が「プレミアム料」なのかがひと目で分かるようになります。

修正版：kcom.html
HTML
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>カブコム在庫照会</title>
</head>
<body>

<h2 id="title"></h2>
<pre id="result">読み込み中...</pre>

<script>
const params = new URLSearchParams(location.search);
const code = params.get("code");
document.getElementById("title").textContent = "銘柄コード: " + (code ? code : "未指定");

fetch("MarginBrand.csv?t=" + new Date().getTime())
    .then(r => {
        if (!r.ok) throw new Error("CSVが見つかりません");
        return r.arrayBuffer(); 
    })
    .then(buf => {
        // Shift_JISでデコード
        const text = new TextDecoder("shift-jis").decode(buf);
        const lines = text.split(/\r?\n/);
        
        if (lines.length === 0) {
            document.getElementById("result").textContent = "ファイルが空です";
            return;
        }

        // 1行目（列名）を取得
        const header = lines[0];

        // 指定コードと一致する行を抽出（2行目以降から検索）
        const filtered = lines.slice(1).filter(line => {
            const cols = line.split(",");
            return cols[0] === code; 
        });

        if (filtered.length === 0) {
            // 該当データがなくてもヘッダーだけは出す
            document.getElementById("result").textContent = header + "\n(該当データなし)";
        } else {
            // ヘッダーと抽出結果を結合して表示
            document.getElementById("result").textContent = header + "\n" + filtered.join("\n");
        }
    })
    .catch(e => {
        document.getElementById("result").textContent = "エラー: " + e.message;
    });
</script>

</body>
</html>
