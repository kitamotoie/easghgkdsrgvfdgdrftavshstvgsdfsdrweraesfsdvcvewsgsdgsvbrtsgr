<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>最新在庫表示</title>
    <style>
        body { font-family: monospace; font-size:16px; margin:0; background: #fff; }
        /* 右端で改行させず、はみ出たら横スクロールさせる設定 */
        #output {
            white-space: pre; 
            overflow-x: auto;
            padding: 10px;
            line-height: 1.2;
        }
        header { background-color: #f8f8f8; padding: 5px 10px; border-bottom: 1px solid #ccc; }
        header a { text-decoration: none; color: #0077cc; font-weight: bold; margin-right: 15px; }
        a { color: #0077cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <a href="https://..." target="_blank">ひチェック</a>
        <a href="https://..." target="_blank">まチェック</a>
        <span id="update-info" style="font-size:12px; color:#666;"></span>
    </header>

    <div id="output">読み込み中...</div>

    <script>
        async function loadCSV() {
            try {
                // キャッシュ回避のため時刻を付けて読み込み
                const response = await fetch('最新在庫_data.csv?' + new Date().getTime());
                const text = await response.text();
                const lines = text.trim().split('\n');
                
                const outputDiv = document.getElementById('output');
                outputDiv.innerHTML = ''; // クリア

                lines.forEach(line => {
                    // カンマ区切りのデータを分解
                    // 0:在庫, 1:株価, 2:希望, 3:評価額, 4:単価, 5:トータル, 6:ID, 7:名称
                    const c = line.split(',');
                    if (c.length < 5) return;

                    // 以前の print(formatted_string) と同じような見た目を再現
                    // リンクなどはここで自由に組み立て
                    const rowText = 
                        `${c[0].padStart(7)}株 ` +
                        `${c[1].padStart(7)} ` +
                        `${c[2].padStart(5)} ` +
                        `${c[3].padStart(11)} ` +
                        `@${c[4].padStart(4)}→${c[5].padStart(5)} ` +
                        `<a href="https://torihikitoriko.com/zaiko-${c[6]}/" target="_blank">${c[6]}</a> ` +
                        `<a href="https://96ut.com/stock/crosscost.php?code=${c[6]}" target="_blank">ｺｽﾄ</a> ` +
                        `${c[7]}`;

                    const div = document.createElement('div');
                    div.innerHTML = rowText;
                    outputDiv.appendChild(div);
                });
                document.getElementById('update-info').textContent = ' 更新: ' + new Date().toLocaleString();
            } catch (e) {
                document.getElementById('output').textContent = 'エラー: CSVが見つかりません';
            }
        }
        loadCSV();
    </script>
</body>
</html>
