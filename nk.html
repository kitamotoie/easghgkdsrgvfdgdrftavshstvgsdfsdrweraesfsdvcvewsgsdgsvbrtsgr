<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NK履歴</title>
    <style>
        pre {
            font-family: "MS Gothic", "Osaka-Mono", monospace;
            line-height: 1.5;
            white-space: pre;
            background-color: #f4f4f4;
            padding: 15px;
            border: 1px solid #ccc;
            overflow-x: auto; /* 横長データへの対応 */
        }
        #update-time {
            font-size: 0.8em;
            color: #666;
            margin-left: 10px;
        }
    </style>
</head>
<body>

<h2>
    <span id="title"></span>
    <span id="update-time"></span>
</h2>
<pre id="result">読み込み中...</pre>

<script>
const params = new URLSearchParams(location.search);
const code = params.get("code");
document.getElementById("title").textContent = "銘柄コード: " + (code ? code : "未指定");

// NK.CSV を読み込む（キャッシュ回避のためタイムスタンプ付与）
fetch("NK.CSV?t=" + new Date().getTime())
    .then(r => {
        if (!r.ok) throw new Error("NK.CSVが見つかりません");
        const lastModified = r.headers.get("Last-Modified");
        if (lastModified) {
            const d = new Date(lastModified);
            document.getElementById("update-time").textContent = 
                `(更新: ${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")})`;
        }
        return r.arrayBuffer(); 
    })
    .then(buf => {
        // Shift-JISでデコード
        const text = new TextDecoder("shift-jis").decode(buf);
        
        // CSVのパース（カンマ区切り。ただしダブルクォーテーション内のカンマは無視せず、簡易的に処理）
        const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
        if (lines.length === 0) return;

        // ヘッダー行
        const header = lines[0].split(",").map(h => h.replace(/"/g, ""));
        
        // データ行の処理
        const dataRows = lines.slice(1)
            .map(l => {
                // ダブルクォーテーションで囲まれた数値のカンマを除去しつつ分割
                // 例: "1,184" -> 1184
                return l.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(item => item.replace(/"/g, ""));
            })
            .filter(c => {
                // フィルタ条件: 銘柄コード(6列目: インデックス5)が一致すること
                // もし「入金」などの行（コードがない行）も含めたい場合は条件を調整してください
                return c[5] === code;
            }); 

        const targetRows = [header, ...dataRows];

        if (dataRows.length === 0) {
            document.getElementById("result").textContent = header.join(" | ") + "\n(該当データなし)";
            return;
        }

        // 文字の表示幅を計算 (全角2, 半角1)
        const getDisplayWidth = (str) => {
            let width = 0;
            for (let i = 0; i < str.length; i++) {
                const c = str.charCodeAt(i);
                if ((c >= 0x0 && c < 0x81) || (c >= 0xff61 && c <= 0xff9f)) {
                    width += 1;
                } else {
                    width += 2;
                }
            }
            return width;
        };

        // 各列の最大幅を算出
        const colWidths = header.map((_, i) => Math.max(...targetRows.map(row => getDisplayWidth(row[i] || ""))));

        // 表形式に整形
        const formatted = targetRows.map(row => {
            return row.map((val, i) => {
                const s = val || "";
                const padSize = colWidths[i] - getDisplayWidth(s);
                return s + " ".repeat(padSize);
            }).join(" | ");
        }).join("\n");

        document.getElementById("result").textContent = formatted;
    })
    .catch(e => {
        document.getElementById("result").textContent = "エラー: " + e.message;
    });
</script>

</body>
</html>
