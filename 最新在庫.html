<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Stock & History Dash</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #fff;
        }
        body { 
            display: flex;
            flex-direction: column;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            font-size: 16px; color: #333;
        }
        header { 
            background-color: #f8f8f8; padding: 10px 15px; border-bottom: 1px solid #ccc; 
            flex-shrink: 0;
            z-index: 100; line-height: 1.6;
        }
        header a { text-decoration: none; color: #0077cc; font-weight: bold; margin-right: 15px; font-size: 15px; }
        .update-info { font-size: 13px; color: #444; display: flex; flex-wrap: wrap; gap: 20px; margin-top: 8px; font-weight: bold; }
        .update-info span { border-left: 4px solid #0077cc; padding-left: 8px; white-space: nowrap; }
        
        #output { 
            flex-grow: 1; 
            overflow: auto;
            padding: 10px; 
            line-height: 1.6;
        }
        
        /* 成行必要額の表示列が追加されたため、全体の最小横幅を2650pxから2810pxへ拡張 */
        .row { display: flex; border-bottom: 1px solid #eee; padding: 6px 0; align-items: center; min-width: 2810px; } 
        .row:hover { background-color: #eef6ff; }
        
        .col-main { width: 455px; flex-shrink: 0; white-space: pre; box-sizing: border-box; }
        .col-name { width: 420px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 10px; }
        .col-links { width: 350px; flex-shrink: 0; } 
        .col-stock { width: 380px; flex-shrink: 0; background-color: #f9f9f9; padding-left: 10px; border-left: 1px solid #ddd; }
        .col-history { width: 400px; flex-shrink: 0; background-color: #fffaf0; padding-left: 10px; border-left: 1px solid #ddd; }
        
        .col-ratio { width: 380px; flex-shrink: 0; padding-left: 10px; border-left: 1px solid #ddd; font-size: 14px; white-space: nowrap; }
        
        /* 成行必要額を表示する列のスタイル（色なし・文字サイズを揃えたもの） */
        .col-nari { width: 160px; flex-shrink: 0; padding-left: 10px; border-left: 1px solid #ddd; font-size: 14px; white-space: nowrap; }
        
        .links a { color: #0077cc; text-decoration: none; margin-right: 10px; font-size: 15px; }
        .links a:hover { text-decoration: underline; }
        .code-link { color: #0077cc; text-decoration: none; margin-right: 8px; display: inline-block; font-weight: bold; }
        .name-text { color: #000; }
        .days-text { color: #333; margin-right: 8px; }
    </style>
</head>
<body>

<header>
    <div>
        <a href="https://kitamotoie.github.io/easghgkdsrgvfdgdrftavshstvgsdfsdrweraesfsdvcvewsgsdgsvbrtsgr/%E3%81%B2_cross_check.html" target="_blank" rel="noreferrer">ひチェック</a>
        <a href="https://kitamotoie.github.io/easghgkdsrgvfdgdrftavshstvgsdfsdrweraesfsdvcvewsgsdgsvbrtsgr/%E3%81%BE_cross_check.html" target="_blank" rel="noreferrer">まチェック</a>
        <a href="https://piyoch.com/news/" target="_blank" rel="noreferrer">ぴよ</a>
        <a href="https://gokigen-life.tokyo/calendar/" target="_blank" rel="noreferrer">ごき</a>
    </div>
    <div class="update-info">
        <span id="time-my">自分: 不明</span>
        <span id="time-rakuten">楽天: 不明</span>
        <span id="time-esma">Eスマ: 不明</span>
    </div>
</header>

<div id="output">読み込み中...</div>

<script>
function getLimitWidth(price) {
    if (price < 100) return 30;
    if (price < 200) return 50;
    if (price < 500) return 80;
    if (price < 1000) return 100;
    if (price < 1500) return 300;
    if (price < 2000) return 400;
    if (price < 3000) return 500;
    if (price < 5000) return 700;
    if (price < 7000) return 1000;
    if (price < 10000) return 1500;
    if (price < 15000) return 3000;
    if (price < 20000) return 4000;
    if (price < 30000) return 5000;
    if (price < 50000) return 7000;
    return 10000;
}

const fmt = (val) => {
    if (val === undefined || val === null || String(val).trim() === "") return "";
    const cleanVal = String(val).replace(/,/g, '');
    const n = parseFloat(cleanVal);
    return isNaN(n) ? val : n.toLocaleString();
};

const raw = (val) => {
    if (val === undefined || val === null) return "";
    return String(val).replace(/,/g, '').trim();
};

const getID = (str) => {
    if (!str) return null;
    const m = String(str).trim().match(/[0-9A-Z]{4}/);
    return m ? m[0] : null;
};

const getYutaiValue = (str) => {
    if (!str) return null;
    const m = str.match(/優待価値(\d+)/);
    return m ? parseFloat(m[1]) : null;
};

async function loadAndMergeAll() {
    try {
        const ts = new Date().getTime();
        const fetchOpt = { cache: 'no-store' };

        const [resR, resE, resM] = await Promise.all([
            fetch('楽天定時在庫.CSV?' + ts, fetchOpt),
            fetch('MarginBrand.csv?' + ts, fetchOpt),
            fetch('最新在庫_data.csv?' + ts, fetchOpt)
        ]);

        const textR = resR.ok ? new TextDecoder('shift-jis').decode(await resR.arrayBuffer()) : "";
        const textE = resE.ok ? new TextDecoder('shift-jis').decode(await resE.arrayBuffer()) : "";
        const textMy = resM.ok ? await resM.text() : "";

        const rakutenMap = {};
        textR.split(/\r?\n/).forEach(line => {
            const c = line.split(',');
            const id = getID(c[3]);
            if (!id) return;
            if (id === "ZZZZ") {
                document.getElementById('time-rakuten').textContent = `楽天: ${c[0].trim()}`;
                return;
            }
            rakutenMap[id] = c[0].trim().replace(/,/g, '');
        });

        // --- Eスマ(MarginBrand.csv) 解析セクション ---
        const esmaMap = {};
        const linesE = textE.split(/\r?\n/);
        
        // 列番号の初期値（通常時）
        let sIdx = 3; // 在庫
        let pIdx = 4; // プレミアム
        let tIdx = 3; // ZZZZ時の時間列

        if (linesE.length > 0) {
            const header = linesE[0].split(',');
            // 「申込数量」というヘッダーが含まれているか確認
            if (header.some(h => h.includes("申込数量"))) {
                sIdx = 4; // 在庫が5列目にずれる
                pIdx = 6; // プレミアムが7列目にずれる
                tIdx = 7; // ZZZZ時の時間もずれると想定
            }
        }

        linesE.forEach((line, index) => {
            const c = line.split(',');
            const id = getID(c[0]);
            if (!id) return;

            if (id === "ZZZZ") {
                const timeStr = (c.length >= 8) ? c[tIdx + 4] : c[tIdx]; // 長期フラグ位置等により調整
                // 既存ロジック互換のため、安全策として直接判定も残す
                const finalTime = (c.length >= 8) ? c[7] : c[3];
                if (finalTime) document.getElementById('time-esma').textContent = `Eスマ: ${finalTime.trim()}`;
                return;
            }

            // 「長期」が含まれる行のみ対象
            if (c[2] && c[2].includes("長期")) {
                let stock = c[sIdx] ? c[sIdx].trim().replace(/,/g, '') : "0";
                let premium = c[pIdx] ? c[pIdx].trim() : "";

                esmaMap[id] = { 
                    s: stock, 
                    p: premium 
                };
            }
        });

        if (textMy) {
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = '';
            textMy.split(/\r?\n/).forEach(line => {
                const c = line.split(',');
                
                // ZZZZの判定
                const zIndex = c.findIndex(item => item && item.trim() === "ZZZZ");
                if (zIndex !== -1) {
                    const timeVal = c[zIndex + 1] ? c[zIndex + 1].trim() : "";
                    if (timeVal) document.getElementById('time-my').textContent = `自分: ${timeVal}`;
                    return; 
                }

                const id = getID(c[6]);
                if (!id) return;
                if (c.length < 8) return; 

                const daysStr = (c[8] && c[8].trim() !== "") ? c[8].trim() : "0";
                const daysNum = parseFloat(daysStr);
                const totalAmount = parseFloat(raw(c[3]));
                const kibouSuu = parseFloat(raw(c[2]));
                const yutaiVal = getYutaiValue(c[7]);

                // --- 【ごきげんライフ完全一致ロジック】 ---
                let myCostTotal = 0;
                let myCostPer100 = 0;
                if (!isNaN(totalAmount) && !isNaN(daysNum) && kibouSuu > 0) {
                    const price100 = totalAmount / (kibouSuu / 100); 
                    const buy100 = Math.floor(price100 * 0.0404 * 1 / 365);
                    const sell100 = Math.floor(price100 * 0.0190 * daysNum / 365);
                    myCostPer100 = buy100 + sell100;
                    myCostTotal = myCostPer100 * (kibouSuu / 100);
                }

                let ratioInfo = "";
                let bankInterestDisp = "";
                let profitDisp = "";

　　　　　　　　if (yutaiVal && yutaiVal !== 0) {
                    const costRate = (myCostTotal / yutaiVal * 100).toFixed(2);
                    const yieldRate = (totalAmount !== 0) ? (yutaiVal / totalAmount * 100).toFixed(2) : "--";
                    
                    // 追加：金利1.1%用の計算
                    const costRate2 = ((myCostTotal + (totalAmount * 0.011 * daysNum / 365)) / yutaiVal * 100).toFixed(2);
                    const netProfit2 = Math.floor(yutaiVal - (myCostTotal + (totalAmount * 0.011 * daysNum / 365)));
                    
                    ratioInfo = `コ${costRate}% 利${yieldRate}% コ2${costRate2}% 利2${netProfit2}円`;
                    
                    const netProfit = Math.floor(yutaiVal - myCostTotal);
                    profitDisp = ` 利${netProfit}円`;

                    const taxRate = 0.79685;
                    const bInterest = Math.floor(totalAmount * 0.0075 * ((daysNum + 1) / 365) * taxRate);
                    bankInterestDisp = ` (預${bInterest}円)`;
                }

                const daysHtml = `<span class="days-text">${daysStr}日</span>`;
                const finalRatio = daysHtml + ratioInfo + profitDisp + bankInterestDisp;
                const costDisplay = `@${String(myCostPer100).padStart(4)}→${String(myCostTotal).padStart(5)}`;

                const rStock = rakutenMap[id];
                const eData = esmaMap[id];
                const rakutenStr = rStock !== undefined ? `楽:${rStock.padStart(6)} ` : " ".repeat(10);
                let esmaStr = eData ? `E:${eData.s.padStart(7)} P:${eData.p.padStart(4)} ` : " ".repeat(19);

                // --- 【成行発注用の口座必要資金 逆算ロジック（色なし）】 ---
                let nariFundsHtml = "";
                if (!isNaN(totalAmount) && kibouSuu > 0) {
                    const basePrice = totalAmount / kibouSuu;
                    const width = getLimitWidth(basePrice);
                    const stopHighPrice = basePrice + width;
                    const requiredCash = stopHighPrice * kibouSuu;
                    
                    nariFundsHtml = `<div class="col-nari"><span>成行:${requiredCash.toLocaleString()}円</span></div>`;
                } else {
                    nariFundsHtml = `<div class="col-nari"><span>-- 円</span></div>`;
                }

                const row = document.createElement('div');
                row.className = 'row';
                row.innerHTML = 
                    `<div class="col-main">${c[0].padStart(7)}株 ${fmt(c[1]).padStart(7)} ${c[2].padStart(5)} ${fmt(c[3]).padStart(10)} ${costDisplay} </div>` + 
                    `<div class="col-name" title="${c[7]}">` +
                        `<a href="https://torihikitoriko.com/zaiko-${id}/#toc0c" target="_blank" rel="noreferrer" class="code-link">${id}</a>` +
                        `<span class="name-text">${c[7]}</span>` +
                    `</div>` + 
                    `<div class="col-links links">` +
                        `<a href='https://96ut.com/stock/crosscost.php?code=${id}' target='_blank' rel="noreferrer">96ｺｽﾄ</a>` +
                        `<a href='https://gokigen-life.tokyo/${id}yutai/' target='_blank' rel="noreferrer">嫌</a>` +
                        `<a href='history.html?code=${id}' target='_blank' rel="noreferrer">nk存</a>` +
                        `<a href='history-raku.html?code=${id}' target='_blank' rel="noreferrer">楽存</a>` +
                        `<a href='kcom.html?code=${id}' target='_blank' rel="noreferrer">Eｽ存</a>` +
                        `<a href='https://96ut.com/stock/urizan.php?code=${id}' target='_blank' rel="noreferrer">96残</a>` +
                    `</div>` +
                    `<div class="col-ratio">${finalRatio}</div>` +
                    `<div class="col-stock">${rakutenStr}${esmaStr}</div>` +
                    `<div class="col-history links">` +
                        `<a href='nk.html?code=${id}' target='_blank' rel="noreferrer">nk歴</a>` +
                        `<a href='sbi.html?code=${id}' target='_blank' rel="noreferrer">SB歴</a>` +    
                        `<a href='rakuten.html?code=${id}' target='_blank' rel="noreferrer">楽歴</a>` +
                        `<a href='m-sbi.html?code=${id}' target='_blank' rel="noreferrer">M-SB歴</a>` +
                    `</div>` +
                    nariFundsHtml; // 画面の一番右端に追加
                outputDiv.appendChild(row);
            });
        }
    } catch (err) {
        document.getElementById('output').textContent = 'エラー: ' + err.message;
    }
}
loadAndMergeAll();
</script>
</body>
</html>
