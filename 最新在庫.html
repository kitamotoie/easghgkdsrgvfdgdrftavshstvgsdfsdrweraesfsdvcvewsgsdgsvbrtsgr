<script>
function formatFileDate(lastModified) {
    if (!lastModified) return "--/-- --:--";
    const d = new Date(lastModified);
    const m = (d.getMonth()+1).toString().padStart(2,'0');
    const date = d.getDate().toString().padStart(2,'0');
    const h = d.getHours().toString().padStart(2,'0');
    const min = d.getMinutes().toString().padStart(2,'0');
    return `${m}/${date} ${h}:${min}`;
}

async function loadAndMergeAll() {
    try {
        const ts = new Date().getTime();
        
        // 3つのファイルを同時に読み込み開始（高速化）
        const [resR, resE, resM] = await Promise.all([
            fetch('楽天定時在庫.CSV?' + ts),
            fetch('MarginBrand.csv?' + ts),
            fetch('最新在庫_data.csv?' + ts)
        ]);

        const rakutenMap = {};
        if (resR.ok) {
            document.getElementById('time-rakuten').textContent = '楽天: ' + formatFileDate(resR.headers.get('Last-Modified'));
            const text = await resR.text();
            text.trim().split('\n').forEach(line => {
                const c = line.split(',');
                if (c.length > 1) {
                    const m = c[1].match(/^\d{4}/);
                    if (m) rakutenMap[m[0]] = c[0].trim();
                }
            });
        }

        const esmaMap = {};
        if (resE.ok) {
            document.getElementById('time-esma').textContent = 'Eスマ: ' + formatFileDate(resE.headers.get('Last-Modified'));
            const text = await resE.text();
            text.trim().split('\n').forEach(line => {
                const c = line.split(',');
                if (c[2] === "長期") esmaMap[c[0]] = { s: c[4] || "0", p: c[5] || "0" };
            });
        }

        if (resM.ok) {
            document.getElementById('time-my').textContent = '自分: ' + formatFileDate(resM.headers.get('Last-Modified'));
            const textMy = await resM.text();
            const lines = textMy.trim().split('\n');
            const tbody = document.getElementById('output-tbody');
            
            const fmt = (v) => {
                const n = parseFloat(String(v).replace(/,/g, ''));
                return isNaN(n) ? v : n.toLocaleString();
            };

            let htmlBuffer = "";
            lines.forEach(line => {
                const c = line.split(',');
                if (c.length < 7) return;
                const id = c[6].trim();
                const r = rakutenMap[id];
                const e = esmaMap[id];

                // シンプルなリンク構造を組み立て
                htmlBuffer += `<tr>
