<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>在庫総合照合システム</title>
    <style>
        body { 
            font-family: "Courier New", Consolas, monospace; 
            font-size: 14px; margin: 0; background: #fff; color: #333;
        }
        header { 
            background-color: #f8f8f8; padding: 8px 15px; border-bottom: 1px solid #ccc; 
            position: sticky; top: 0; z-index: 100;
        }
        header a { text-decoration: none; color: #0077cc; font-weight: bold; margin-right: 15px; font-size: 13px; }
        #output { white-space: pre; padding: 10px; line-height: 1.5; overflow-x: auto; }
        .row { display: block; border-bottom: 1px solid #eee; padding: 2px 0; }
        
        /* リンクの枠線もシンプルに */
        .links a { 
            color: #0077cc; text-decoration: none; margin-right: 5px; 
            border: 1px solid #ccc; padding: 0 3px; font-size: 11px;
        }
        #update-time { font-size: 12px; color: #888; }
    </style>
</head>
<body>

<header>
    <a href="https://..." target="_blank">ひチェック</a>
    <a href="https://..." target="_blank">まチェック</a>
    <span id="update-time">読み込み中...</span>
</header>

<div id="output">全データを照合中...</div>

<script>
async function loadAndMergeAll() {
    try {
        const ts = new Date().getTime();
        
        // --- 1. 楽天定時在庫.CSV の読み込み ---
        const resRakuten = await fetch('楽天定時在庫.CSV?' + ts);
        const rakutenMap = {};
        if (resRakuten.ok) {
            const text = await resRakuten.text();
            text.trim().split('\n').forEach(line => {
                const c = line.split(',');
                if (c.length > 1) {
                    const codeMatch = c[1].trim().match(/^\d{4}/);
                    if (codeMatch) rakutenMap[codeMatch[0]] = c[0].trim();
                }
            });
        }

        // --- 2. MarginBrand.csv (Eスマ) の読み込み ---
        const resEsma = await fetch('MarginBrand.csv?' + ts);
        const esmaMap = {};
        if (resEsma.ok) {
            const text = await resEsma.text();
            text.trim().split('\n').forEach(line => {
                const c = line.split(',');
                if (c[2] === "長期") {
                    esmaMap[c[0]] = { stock: c[4] || "0", prem: c[5] || "0" };
                }
            });
        }

        // --- 3. 最新在庫_data.csv (自分のリスト) の読み込み ---
        const resMy = await fetch('最新在庫_data.csv?' + ts);
        const textMy = await resMy.text();
        const myLines = textMy.trim().split('\n');
        
        const outputDiv = document.getElementById('output');
        outputDiv.innerHTML = '';

        const fmt = (val) => {
            const n = parseFloat(String(val).replace(/,/g, ''));
            return isNaN(n) ? val : n.toLocaleString();
        };

        myLines.forEach(line => {
            const c = line.split(','); 
            if (c.length < 7) return;

            const id = c[6].trim();
            
            // 楽天情報（色なし）
            const rStock = rakutenMap[id];
            let rakutenStr = "".padStart(13);
            if (rStock !== undefined) {
                rakutenStr = `楽:${fmt(rStock).padStart(6)} `;
            }

            // Eスマ情報（色なし）
            const eData = esmaMap[id];
            let esmaStr = "".padStart(20);
            if (eData) {
                esmaStr = `E長:${fmt(eData.stock).padStart(6)} P:${eData.prem.padStart(4)} `;
            }

            const row = document.createElement('span');
            row.className = 'row';
            row.innerHTML = 
                `${c[0].padStart(7)}株 ` + 
                `${fmt(c[1]).padStart(7)} ` + 
                `${c[2].padStart(5)} ` + 
                `${fmt(c[3]).padStart(10)} ` + 
                `@${fmt(c[4]).padStart(4)}→${fmt(c[5]).padStart(5)} ` + 
                rakutenStr + 
                esmaStr +
                `<span class="links">` +
                `<a href='https://torihikitoriko.com/zaiko-${id}/#toc0c' target='_blank'>${id}</a>` +
                `<a href='history-raku.html?code=${id}' target='_blank'>楽</a>` +
                `<a href='https://96ut.com/stock/urizan.php?code=${id}' target='_blank'>売残</a>` +
                `</span>` +
                `${c[7]}`;

            outputDiv.appendChild(row);
        });

        document.getElementById('update-time').textContent = '更新: ' + new Date().toLocaleString();

    } catch (err) {
        document.getElementById('output').textContent = 'エラー: ' + err.message;
    }
}

loadAndMergeAll();
</script>
</body>
</html>
