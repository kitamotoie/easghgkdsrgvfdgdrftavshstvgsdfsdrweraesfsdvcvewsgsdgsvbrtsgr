<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>在庫総合管理システム</title>
    <style>
        body { 
            font-family: "Courier New", Consolas, monospace; 
            font-size: 14px; margin: 0; background: #fff; color: #333;
        }
        header { 
            background-color: #f8f8f8; padding: 10px 15px; border-bottom: 1px solid #ccc; 
            position: sticky; top: 0; z-index: 100; line-height: 1.6;
        }
        header a { text-decoration: none; color: #0077cc; font-weight: bold; margin-right: 15px; font-size: 13px; }
        .update-info { font-size: 11px; color: #555; display: block; margin-top: 5px; font-weight: bold; }
        .update-info span { margin-right: 20px; border-left: 4px solid #0077cc; padding-left: 6px; background: #eee; padding-right: 4px; }
        #output { white-space: pre; padding: 10px; line-height: 1.5; overflow-x: auto; }
        .row { display: block; border-bottom: 1px solid #eee; padding: 2px 0; color: #333; }
        .row:hover { background-color: #eef6ff; }
        .links a { color: #0077cc; text-decoration: none; margin-right: 8px; }
        .links a:hover { text-decoration: underline; background-color: #fffae6; }
        .fixed-box { display: inline-block; white-space: pre; vertical-align: top; }
    </style>
</head>
<body>

<header>
    <div>
        <a href="https://kitamotoie.github.io/easghgkdsrgvfdgdrftavshstvgsdfsdrweraesfsdvcvewsgsdgsvbrtsgr/%E3%81%B2_cross_check.html" target="_blank">ひチェック</a>
        <a href="https://kitamotoie.github.io/easghgkdsrgvfdgdrftavshstvgsdfsdrweraesfsdvcvewsgsdgsvbrtsgr/%E3%81%BE_cross_check.html" target="_blank">まチェック</a>
        <a href="https://piyoch.com/news/" target="_blank">ぴよの</a>
        <a href="https://gokigen-life.tokyo/calendar/" target="_blank">ごきカレ</a>
    </div>
    <div class="update-info">
        <span id="time-my">自分: --/-- --:--</span>
        <span id="time-rakuten">楽天データ: --/-- --:--</span>
    </div>
</header>

<div id="output">読み込み中...</div>

<script>
function extractRakutenDate(text) {
    const m = text.match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/);
    return m ? `${m[2]}/${m[3]} ${m[4]}:${m[5]}` : "不明";
}

function formatFileDate(lastModified) {
    if (!lastModified) return "--/-- --:--";
    const d = new Date(lastModified);
    return `${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
}

async function loadAndMergeAll() {
    try {
        const ts = new Date().getTime();
        const [resR, resE, resM] = await Promise.all([
            fetch('楽天定時在庫.CSV?' + ts).catch(() => ({ok:false})),
            fetch('MarginBrand.csv?' + ts).catch(() => ({ok:false})),
            fetch('最新在庫_data.csv?' + ts).catch(() => ({ok:false}))
        ]);

        const rakutenMap = {};
        if (resR.ok) {
            const text = await resR.text();
            document.getElementById('time-rakuten').textContent = '楽天データ: ' + extractRakutenDate(text);
            text.trim().split('\n').forEach(line => {
                const c = line.split(',');
                if (c.length > 1) {
                    const m = c[1].trim().match(/^\d{4}/);
                    // 楽天在庫はカンマを消した生の値を格納
                    if (m) rakutenMap[m[0]] = c[0].trim().replace(/,/g, '');
                }
            });
        }

        const esmaMap = {};
        if (resE.ok) {
            const text = await resE.text();
            text.trim().split('\n').forEach(line => {
                const c = line.split(',');
                if (c.length > 6 && c[2].trim() === "長期") {
                    esmaMap[c[0].trim()] = { 
                        s: c[4].trim() || "0", 
                        p: c[6].trim() || "0" 
                    };
                }
            });
        }

        if (resM.ok) {
            document.getElementById('time-my').textContent = '自分: ' + formatFileDate(resM.headers.get('Last-Modified'));
            const textMy = await resM.text();
            const lines = textMy.trim().split('\n');
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = '';

            const fmt = (val) => {
                const n = parseFloat(String(val).replace(/,/g, ''));
                return isNaN(n) ? val : n.toLocaleString();
            };

            lines.forEach(line => {
                const c = line.split(','); 
                if (c.length < 7) return;
                const id = c[6].trim();
                const r = rakutenMap[id];
                const e = esmaMap[id];

                // 楽天：カンマなしで表示
                const rakutenText = r !== undefined ? `楽:${r.padStart(6)} ` : "".padStart(10);
                
                // Eスマ：在庫はカンマあり、プレ料はそのまま
                const esmaText = e ? `E長:${fmt(e.s).padStart(7)} P:${e.p.padStart(4)} ` : "".padStart(19);

                const row = document.createElement('div');
                row.className = 'row';
                row.innerHTML = 
                    `<span class="fixed-box" style="width:460px;">${c[0].padStart(7)}株 ${fmt(c[1]).padStart(7)} ${c[2].padStart(5)} ${fmt(c[3]).padStart(10)} @${fmt(c[4]).padStart(4)}→${fmt(c[5]).padStart(5)} </span>` + 
                    `<span class="fixed-box" style="width:100px;">${rakutenText}</span>` + 
                    `<span class="fixed-box" style="width:160px;">${esmaText}</span>` + 
                    `<span class="links" style="display:inline-block; width:290px;">` +
                    `<a href='https://torihikitoriko.com/zaiko-${id}/#toc0c' target='_blank'>${id}</a>` +
                    `<a href='https://96ut.com/stock/crosscost.php?code=${id}' target='_blank'>ｺｽﾄ</a>` +
                    `<a href='https://gokigen-life.tokyo/${id}yutai/' target='_blank'>Go</a>` +
                    `<a href='history.html?code=${id}' target='_blank'>歴</a>` +
                    `<a href='history-raku.html?code=${id}' target='_blank'>楽</a>` +
                    `<a href='kcom.html?code=${id}' target='_blank'>kcom</a>` +
                    `<a href='https://96ut.com/stock/urizan.php?code=${id}' target='_blank'>売残</a>` +
                    `</span>` +
                    `<span>${c[7]}</span>`;

                outputDiv.appendChild(row);
            });
        }
    } catch (err) {
        document.getElementById('output').textContent = 'エラー: ' + err.message;
    }
}
loadAndMergeAll();
</script>
</body>
</html>
