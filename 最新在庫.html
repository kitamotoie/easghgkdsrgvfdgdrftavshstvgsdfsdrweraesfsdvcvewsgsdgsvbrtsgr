<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Stock & History Dash</title>
    <style>
        /* ページ全体のスクロールを禁止し、#output内だけでスクロールさせる */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* 全体のスクロールを止める */
            background: #fff;
        }
        body { 
            display: flex;
            flex-direction: column;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            font-size: 16px; color: #333;
        }
        header { 
            background-color: #f8f8f8; padding: 10px 15px; border-bottom: 1px solid #ccc; 
            flex-shrink: 0; /* ヘッダーの高さは固定 */
            z-index: 100; line-height: 1.6;
        }
        header a { text-decoration: none; color: #0077cc; font-weight: bold; margin-right: 15px; font-size: 15px; }
        .update-info { font-size: 13px; color: #444; display: flex; flex-wrap: wrap; gap: 20px; margin-top: 8px; font-weight: bold; }
        .update-info span { border-left: 4px solid #0077cc; padding-left: 8px; white-space: nowrap; }
        .update-info span:not(:last-child)::after { content: " |"; color: #ccc; margin-left: 15px; }
        
        /* ここが重要：表示領域を固定して、ここにスクロールバーを出す */
        #output { 
            flex-grow: 1; 
            overflow: auto; /* ここに横・縦両方のスクロールバーが出る */
            padding: 10px; 
            line-height: 1.6;
        }
        
        /* 行のスタイル */
        .row { display: flex; border-bottom: 1px solid #eee; padding: 6px 0; align-items: center; min-width: 2200px; } 
        .row:hover { background-color: #eef6ff; }
        
        .col-main { width: 455px; flex-shrink: 0; white-space: pre; box-sizing: border-box; }
        .col-name { width: 420px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 10px; }
        .col-links { width: 350px; flex-shrink: 0; }
        .col-stock { width: 380px; flex-shrink: 0; background-color: #f9f9f9; padding-left: 10px; border-left: 1px solid #ddd; }
        .col-history { width: 400px; flex-shrink: 0; background-color: #fffaf0; padding-left: 10px; border-left: 1px solid #ddd; }
        
        .links a { color: #0077cc; text-decoration: none; margin-right: 10px; font-size: 15px; }
        .links a:hover { text-decoration: underline; }
        .code-link { color: #0077cc; text-decoration: none; margin-right: 8px; display: inline-block; font-weight: bold; }
        .name-text { color: #000; }
    </style>
</head>
<body>

<header>
    <div>
        <a href="https://kitamotoie.github.io/easghgkdsrgvfdgdrftavshstvgsdfsdrweraesfsdvcvewsgsdgsvbrtsgr/%E3%81%B2_cross_check.html" target="_blank" rel="noreferrer">ひチェック</a>
        <a href="https://kitamotoie.github.io/easghgkdsrgvfdgdrftavshstvgsdfsdrweraesfsdvcvewsgsdgsvbrtsgr/%E3%81%BE_cross_check.html" target="_blank" rel="noreferrer">まチェック</a>
        <a href="https://piyoch.com/news/" target="_blank" rel="noreferrer">ぴよ</a>
        <a href="https://gokigen-life.tokyo/calendar/" target="_blank" rel="noreferrer">ごき</a>
    </div>
    <div class="update-info">
        <span id="time-my">自分: 不明</span>
        <span id="time-rakuten">楽天: 不明</span>
        <span id="time-esma">Eスマ: 不明</span>
    </div>
</header>

<div id="output">読み込み中...</div>

<script>
const fmt = (val) => {
    if (val === undefined || val === null || String(val).trim() === "") return "";
    const cleanVal = String(val).replace(/,/g, '');
    const n = parseFloat(cleanVal);
    return isNaN(n) ? val : n.toLocaleString();
};

const raw = (val) => {
    if (val === undefined || val === null) return "";
    return String(val).replace(/,/g, '').trim();
};

const getID = (str) => {
    if (!str) return null;
    const m = String(str).trim().match(/[0-9A-Z]{4}/);
    return m ? m[0] : null;
};

async function loadAndMergeAll() {
    try {
        const ts = new Date().getTime();
        const fetchOpt = { cache: 'no-store' };

        const [resR, resE, resM] = await Promise.all([
            fetch('楽天定時在庫.CSV?' + ts, fetchOpt),
            fetch('MarginBrand.csv?' + ts, fetchOpt),
            fetch('最新在庫_data.csv?' + ts, fetchOpt)
        ]);

        const textR = resR.ok ? new TextDecoder('shift-jis').decode(await resR.arrayBuffer()) : "";
        const textE = resE.ok ? new TextDecoder('shift-jis').decode(await resE.arrayBuffer()) : "";
        const textMy = resM.ok ? await resM.text() : "";

        const rakutenMap = {};
        textR.split(/\r?\n/).forEach(line => {
            const c = line.split(',');
            const id = getID(c[3]);
            if (!id) return;
            if (id === "ZZZZ") {
                document.getElementById('time-rakuten').textContent = `楽天: ${c[0].trim()}`;
                return;
            }
            rakutenMap[id] = c[0].trim().replace(/,/g, '');
        });

        const esmaMap = {};
        textE.split(/\r?\n/).forEach(line => {
            const c = line.split(',');
            const id = getID(c[0]);
            if (!id) return;
            if (id === "ZZZZ") {
                document.getElementById('time-esma').textContent = `Eスマ: ${c[3].trim()}`;
                return;
            }
            // 在庫(c[4])とプレミアム想定(c[5])を保存
            esmaMap[id] = { 
                s: c[4] ? c[4].trim().replace(/,/g, '') : "0", 
                p: c[5] ? c[5].trim() : "" 
            };
        });

        if (textMy) {
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = '';
            textMy.split(/\r?\n/).forEach(line => {
                const c = line.split(',');
                if (c.length < 5) return; 
                
                // 1列目がコード (c[0])
                const id = getID(c[0]);
                if (!id) return;

                if (id === "ZZZZ") {
                    const timeVal = c[7] ? c[7].trim() : (c[4] ? c[4].trim() : "");
                    if (timeVal) document.getElementById('time-my').textContent = `自分: ${timeVal}`;
                    return; 
                }

                // 自社在庫データも同じ構造 (c[3]:保有, c[4]:在庫, c[5]:プレミアム)
                const myK   = c[3] || "0"; 
                const myZ   = c[4] || "0"; 
                const prem  = c[5] ? c[5].trim() : ""; 

                const pStr = (prem && prem !== "0" && prem !== "0.00") ? ` P:${prem}` : "";

                const rStock = rakutenMap[id];
                const eData = esmaMap[id];
                const rakutenStr = rStock !== undefined ? `楽:${rStock.padStart(6)} ` : " ".repeat(10);
                
                // Eスマ表示：在庫(s)とプレミアム(p)
                let esmaStr = " ".repeat(19);
                if (eData) {
                    const pVal = (eData.p && eData.p !== "0" && eData.p !== "0.00") ? ` P:${eData.p}` : "";
                    esmaStr = `E:${eData.s.padStart(7)}${pVal.padEnd(7)}`;
                }

                const row = document.createElement('div');
                row.className = 'row';
                row.innerHTML = 
                    `<div class="col-main">${fmt(myK).padStart(6)}株 在庫:${fmt(myZ).padStart(8)}${pStr.padEnd(8)} ${c[2].padStart(4)}</div>` + 
                    `<div class="col-name" title="${c[1]}">` +
                        `<a href="https://torihikitoriko.com/zaiko-${id}/#toc0c" target="_blank" rel="noreferrer" class="code-link">${id}</a>` +
                        `<span class="name-text">${c[1]}</span>` +
                    `</div>` + 
                    `<div class="col-links links">` +
                        `<a href='https://96ut.com/stock/crosscost.php?code=${id}' target='_blank' rel="noreferrer">96ｺｽﾄ</a>` +
                        `<a href='https://gokigen-life.tokyo/${id}yutai/' target='_blank' rel="noreferrer">嫌</a>` +
                        `<a href='history.html?code=${id}' target='_blank' rel="noreferrer">nk存</a>` +
                        `<a href='history-raku.html?code=${id}' target='_blank' rel="noreferrer">楽存</a>` +
                        `<a href='kcom.html?code=${id}' target='_blank' rel="noreferrer">Eｽ存</a>` +
                        `<a href='https://96ut.com/stock/urizan.php?code=${id}' target='_blank' rel="noreferrer">96残</a>` +
                    `</div>` +
                    `<div class="col-stock">${rakutenStr}${esmaStr}</div>` +
                    `<div class="col-history links">` +
                        `<a href='nk.html?code=${id}' target='_blank' rel="noreferrer">nk歴</a>` +
                        `<a href='sbi.html?code=${id}' target='_blank' rel="noreferrer">SB歴</a>` +    
                        `<a href='rakuten.html?code=${id}' target='_blank' rel="noreferrer">楽歴</a>` +
                        `<a href='m-sbi.html?code=${id}' target='_blank' rel="noreferrer">M-SB歴</a>` +
                    `</div>`;
                outputDiv.appendChild(row);
            });
        }
    } catch (err) {
        document.getElementById('output').textContent = 'エラー: ' + err.message;
    }
}
loadAndMergeAll();
</script>
</body>
</html>
